[package]
name = "iphone-refresher"
version = "0.1.0"
edition = "2024"
description = "Re-signs and reinstalls a personal IPA on an iPhone over Wi-Fi (free Apple ID), AltServer-style."
license = "MIT"

[dependencies]
# Same library and version as iloader 2.4.1, which signs in successfully after Apple's October 2026 change.
# Pinned exactly: both crates make breaking changes in point releases.
isideload = { version = "=0.5.2", default-features = false, features = ["install", "tokio-mt", "fs-storage"] }
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "tcp", "afc", "installation_proxy"] }
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
